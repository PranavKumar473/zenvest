services:

  postgres:
    image: postgres:16-alpine
    container_name: zenvest_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenvest_dev}
      POSTGRES_USER: ${POSTGRES_APP_USER:-zenvest_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me}
    ports:
      # Bound to 127.0.0.1 ONLY — never exposed publicly
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-zenvest_app} -d ${POSTGRES_DB:-zenvest_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: zenvest_redis_dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change-me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      # Bound to 127.0.0.1 ONLY — never exposed publicly
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: zenvest_mailpit_dev
    restart: unless-stopped
    ports:
      # SMTP port — backend sends emails here in dev
      - "127.0.0.1:1025:1025"
      # Web UI to browse captured emails
      - "127.0.0.1:8025:8025"

volumes:
  postgres_dev_data:
    name: zenvest_postgres_dev_data
  redis_dev_data:
    name: zenvest_redis_dev_data

