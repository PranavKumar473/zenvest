# ==============================================================================
# Zenvest Test Configuration
# ==============================================================================

spring.application.name=zenvest-backend-test
spring.threads.virtual.enabled=true

# JPA validation for tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway for tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator for tests
management.endpoints.web.exposure.include=health,info

# Redis in test profile
spring.data.redis.repositories.enabled=false

# Custom test settings
zenvest.auth.jwt.active-kid=test-key-1
zenvest.auth.cookie-domain=localhost
zenvest.auth.cors-allowed-origins=http://localhost:5173
zenvest.email.resend-api-key=test-api-key
zenvest.email.from=test@zenvest.in
zenvest.public-url=http://localhost:8080
zenvest.consent-policy-version=1.0
