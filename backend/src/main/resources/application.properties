# ==============================================================================
# Zenvest Application Configuration
# ==============================================================================

spring.application.name=zenvest-backend

# Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Server Configuration
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# Management & Actuator (Isolated to management port 8081)
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:zenvest_dev}
spring.datasource.username=${DB_USER:zenvest_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=ZenvestHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis Cache and Rate Limiting
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:change-me}
spring.data.redis.timeout=2000ms


# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{requestId:-}] [%X{userId:-}] %-5level %logger{36} - %msg%n
logging.level.in.zenvest=INFO
logging.level.org.springframework.security=INFO

# Zenvest Custom Typed Properties
zenvest.auth.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:/path/to/private.pem}
zenvest.auth.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:/path/to/public.pem}
zenvest.auth.jwt.active-kid=${JWT_ACTIVE_KID:key-2026-01}
zenvest.auth.jwt.secondary-kid=${JWT_SECONDARY_KID:key-2025-01}
zenvest.auth.jwt.secondary-public-key-path=${JWT_SECONDARY_PUBLIC_KEY_PATH:/path/to/public-old.pem}
zenvest.auth.cookie-domain=${COOKIE_DOMAIN:localhost}
zenvest.auth.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
zenvest.email.resend-api-key=${RESEND_API_KEY:change-me}
zenvest.email.from=${EMAIL_FROM:noreply@zenvest.in}
zenvest.funds.amfi-nav-all-url=${AMFI_NAV_ALL_URL:https://www.amfiindia.com/spages/NAVAll.txt}
zenvest.funds.mfapi-base-url=${MFAPI_BASE_URL:https://api.mfapi.in}
zenvest.public-url=${PROJECT_PUBLIC_URL:http://localhost:8080}
zenvest.consent-policy-version=${CONSENT_POLICY_VERSION:1.0}
